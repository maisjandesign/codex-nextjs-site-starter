name: Frontend quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install required skills and locked dependencies
        run: npm run setup
      - name: Verify project setup
        run: npm run setup:check
      - name: Test mandatory skill installation and failure gates
        run: npm run test:setup
      - name: Check types, lint, grid, and story coverage
        run: npm run check
      - name: Build Next.js
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook
